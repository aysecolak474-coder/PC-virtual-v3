name: RDP
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ─────────────────────────────────────────────
      # 1. LIBERAR ESPACIO Y MONTAR DISCO EXTRA
      # ─────────────────────────────────────────────
      - name: Free Up Space & Mount Extra Disk
        run: |
          Write-Host "=== Disk before cleanup ===" -ForegroundColor Cyan
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

          $toRemove = @(
            "$env:SystemDrive\hostedtoolcache\windows\Ruby",
            "$env:SystemDrive\hostedtoolcache\windows\go",
            "$env:SystemDrive\hostedtoolcache\windows\Python",
            "$env:ProgramFiles\dotnet",
            "$env:ProgramFiles\MongoDB",
            "$env:ProgramFiles\PostgreSQL",
            "$env:ProgramFiles (x86)\Google\Chrome",
            "$env:ProgramFiles\Mozilla Firefox"
          )
          foreach ($path in $toRemove) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed: $path" -ForegroundColor Green
            }
          }

          Write-Host "=== Disk D: info ===" -ForegroundColor Cyan
          Get-PSDrive D -ErrorAction SilentlyContinue

          $vhdPath = "D:\extra_disk.vhdx"
          New-VHD -Path $vhdPath -SizeBytes 100GB -Dynamic -ErrorAction SilentlyContinue
          Mount-VHD -Path $vhdPath
          $disk = Get-Disk | Where-Object { $_.OperationalStatus -eq 'Online' -and $_.PartitionStyle -eq 'RAW' } | Select-Object -Last 1
          if ($disk) {
            Initialize-Disk -Number $disk.Number -PartitionStyle MBR -PassThru |
              New-Partition -AssignDriveLetter -UseMaximumSize |
              Format-Volume -FileSystem NTFS -NewFileSystemLabel "ExtraDisk" -Confirm:$false
          }

          Write-Host "=== Disk after setup ===" -ForegroundColor Cyan
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

          "EXTRA_DISK=E:" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STORAGE_ROOT=D:\storage" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "D:\storage" | Out-Null

      # ─────────────────────────────────────────────
      # 2. INSTALAR MESA3D CON SCRIPT OFICIAL (per-machine)
      # ─────────────────────────────────────────────
      - name: Install Mesa3D Full Stack (Software GPU)
        run: |
          Write-Host "=== Installing Mesa3D Full Stack ===" -ForegroundColor Cyan
          
          # Descargar 7-Zip portable
          $sevenZipUrl = "https://www.7-zip.org/a/7zr.exe"
          Invoke-WebRequest -Uri $sevenZipUrl -OutFile "$env:TEMP\7zr.exe" -UseBasicParsing
          
          # Mesa3D MSVC release (incluye script de deploy)
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z"
          Write-Host "Downloading Mesa3D..." -ForegroundColor Cyan
          Invoke-WebRequest -Uri $mesaUrl -OutFile "$env:TEMP\mesa3d.7z" -UseBasicParsing
          
          $mesaDir = "C:\mesa3d"
          New-Item -ItemType Directory -Force -Path $mesaDir | Out-Null
          & "$env:TEMP\7zr.exe" x "$env:TEMP\mesa3d.7z" -o"$mesaDir" -y | Out-Null
          
          # Buscar el script de deploy oficial
          $deployScript = Get-ChildItem -Path $mesaDir -Filter "systemwidedeploy.cmd" -Recurse | Select-Object -First 1
          
          if ($deployScript) {
            Write-Host "Found deploy script at: $($deployScript.FullName)" -ForegroundColor Green
            $scriptDir = Split-Path -Parent $deployScript.FullName
            
            # Ejecutar el script con modo per-machine (1) y x64 (1)
            # El script hace: copia a SysWOW64/System32 con permisos elevados
            # Usamos cmd /c para ejecutar el batch correctamente
            Push-Location $scriptDir
            & cmd /c "systemwidedeploy.cmd 1 1"
            $deployExit = $LASTEXITCODE
            Pop-Location
            
            Write-Host "Deploy script exited with code: $deployExit" -ForegroundColor $(if($deployExit -eq 0){"Green"}else{"Yellow"})
          } else {
            Write-Warning "Deploy script not found, falling back to per-app deployment"
          }
          
          # También copiar a un directorio local para apps que no lean System32
          $mesaBinDir = "$mesaDir\x64"
          $localMesa = "C:\mesa3d\bin"
          New-Item -ItemType Directory -Force -Path $localMesa | Out-Null
          
          # Si encontramos el directorio x64 dentro de la extracción
          $x64Found = Get-ChildItem -Path $mesaDir -Filter "x64" -Recurse -Directory | Select-Object -First 1
          if ($x64Found) {
            Copy-Item "$($x64Found.FullName)\*" "$localMesa\" -Recurse -Force
            Write-Host "Mesa binaries copied to $localMesa" -ForegroundColor Green
          }
          
          # Instalar VC++ Redistributables (necesarios para Mesa)
          $vcUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          Invoke-WebRequest -Uri $vcUrl -OutFile "$env:TEMP\vc_redist.x64.exe" -UseBasicParsing
          Start-Process "$env:TEMP\vc_redist.x64.exe" -ArgumentList "/quiet", "/norestart" -Wait
          
          # Variables de entorno para forzar software rendering
          [Environment]::SetEnvironmentVariable("GALLIUM_DRIVER", "llvmpipe", "Machine")
          [Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.6", "Machine")
          [Environment]::SetEnvironmentVariable("MESA_GLSL_VERSION_OVERRIDE", "460", "Machine")
          [Environment]::SetEnvironmentVariable("LIBGL_ALWAYS_SOFTWARE", "1", "Machine")
          
          # Refrescar env para esta sesión
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:MESA_GL_VERSION_OVERRIDE = "4.6"
          $env:MESA_GLSL_VERSION_OVERRIDE = "460"
          $env:LIBGL_ALWAYS_SOFTWARE = "1"
          
          # Verificar que OpenGL está disponible
          $sys32 = "C:\Windows\System32"
          $openglOk = Test-Path "$sys32\opengl32.dll"
          Write-Host "System32 opengl32.dll present: $openglOk" -ForegroundColor $(if($openglOk){"Green"}else{"Yellow"})
          
          # Guardar info
          "MESA_DIR=$mesaDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MESA_BIN=$localMesa" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          Write-Host "Mesa3D installation completed" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 3. INSTALAR NODE.JS + NPM
      # ─────────────────────────────────────────────
      - name: Install Node.js LTS (with npm)
        run: |
          Write-Host "=== Installing Node.js LTS ===" -ForegroundColor Cyan
          $nodeUrl = "https://nodejs.org/dist/v22.15.0/node-v22.15.0-x64.msi"
          $installer = "$env:TEMP\nodejs_installer.msi"
          
          Invoke-WebRequest -Uri $nodeUrl -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart", "ALLUSERS=1" -Wait
          
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          
          node --version
          npm --version
          Write-Host "Node.js + npm installed successfully" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 4. INSTALAR PYTHON + PIP
      # ─────────────────────────────────────────────
      - name: Install Python
        run: |
          Write-Host "=== Installing Python ===" -ForegroundColor Cyan
          $pythonUrl = "https://www.python.org/ftp/python/3.12.4/python-3.12.4-amd64.exe"
          $installer = "$env:TEMP\python_installer.exe"
          
          Invoke-WebRequest -Uri $pythonUrl -OutFile $installer -UseBasicParsing
          Start-Process $installer -ArgumentList "/quiet", "InstallAllUsers=1", "PrependPath=1", "Include_pip=1", "Include_test=0", "Include_launcher=0" -Wait
          
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WindowsApps\pip*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          
          $pythonPath = "C:\Program Files\Python312\python.exe"
          $pipPath = "C:\Program Files\Python312\Scripts\pip.exe"
          
          if (Test-Path $pythonPath) { & $pythonPath --version } else { python --version }
          if (Test-Path $pipPath) { & $pipPath --version } else { python -m pip --version }
          
          Write-Host "Python installed successfully" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 5. INSTALAR GIT
      # ─────────────────────────────────────────────
      - name: Install Git for Windows
        run: |
          Write-Host "=== Installing Git ===" -ForegroundColor Cyan
          $gitUrl = "https://github.com/git-for-windows/git/releases/download/v2.54.0.windows.1/Git-2.54.0-64-bit.exe"
          $installer = "$env:TEMP\git_installer.exe"
          
          Invoke-WebRequest -Uri $gitUrl -OutFile $installer -UseBasicParsing
          Start-Process $installer -ArgumentList '/VERYSILENT', '/NORESTART', '/NOCANCEL', '/SP-', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS', '/COMPONENTS="icons,ext\reg\shellhere,assoc,assoc_sh"', '/o:PathOption=CmdTools', '/o:DefaultBranchOption=main' -Wait
          
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          
          git --version
          Write-Host "Git installed successfully" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 6. INSTALAR JAVA (REQUERIDO POR MINECRAFT)
      # ─────────────────────────────────────────────
      - name: Install Java 21 (Minecraft compatible)
        run: |
          Write-Host "=== Installing Java 21 LTS ===" -ForegroundColor Cyan
          $javaUrl = "https://download.oracle.com/java/21/latest/jdk-21_windows-x64_bin.exe"
          $installer = "$env:TEMP\jdk21_installer.exe"
          
          Invoke-WebRequest -Uri $javaUrl -OutFile $installer -UseBasicParsing
          Start-Process $installer -ArgumentList "/s", "INSTALLDIR=C:\Java21" -Wait
          
          [Environment]::SetEnvironmentVariable("JAVA_HOME", "C:\Java21", "Machine")
          [Environment]::SetEnvironmentVariable("Path", $env:Path + ";C:\Java21\bin", "Machine")
          $env:Path += ";C:\Java21\bin"
          $env:JAVA_HOME = "C:\Java21"
          
          java -version
          Write-Host "Java 21 installed successfully" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 7. INSTALAR STEAM
      # ─────────────────────────────────────────────
      - name: Install Steam
        run: |
          Write-Host "=== Installing Steam ===" -ForegroundColor Cyan
          $steamUrl = "https://cdn.akamai.steamstatic.com/client/installer/SteamSetup.exe"
          $installer = "$env:TEMP\SteamSetup.exe"
          
          Invoke-WebRequest -Uri $steamUrl -OutFile $installer -UseBasicParsing
          Start-Process $installer -ArgumentList "/S", "/D=C:\Steam" -Wait
          Start-Sleep -Seconds 15
          
          New-Item -ItemType Directory -Force -Path "C:\Steam\steamapps\common" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Steam\steamapps\downloading" | Out-Null
          
          $libraryFile = "C:\Steam\steamapps\libraryfolders.vdf"
          @"
          "LibraryFolders"
          {
            "TimeNextStatsReport"    "0"
            "ContentStatsID"        "-1"
            "1"        "D:\\SteamLibrary"
          }
          "@ | Out-File -FilePath $libraryFile -Encoding UTF8 -Force
          
          New-Item -ItemType Directory -Force -Path "D:\SteamLibrary\steamapps" | Out-Null
          
          $steamExe = "C:\Steam\Steam.exe"
          if (Test-Path $steamExe) {
            Write-Host "Steam installed at: $steamExe" -ForegroundColor Green
          } else {
            Write-Warning "Steam path not found, searching..."
            Get-ChildItem -Path "C:\" -Filter "Steam.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
          }
          
          [Environment]::SetEnvironmentVariable("STEAM_DIR", "C:\Steam", "Machine")
          $env:STEAM_DIR = "C:\Steam"
          
          Write-Host "Steam installed successfully" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 8. CONFIGURAR RDP
      # ─────────────────────────────────────────────
      - name: Configure RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP configured." -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 9. CREAR USUARIO RDP
      # ─────────────────────────────────────────────
      - name: Create RDP User
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]]@(33,35,36,37,38,42,43,45,61,64)
          }
          $rawPassword  = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators"        -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users"  -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "User creation failed"; exit 1
          }

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RDP user created." -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 10. INSTALAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$installer`"","/quiet","/norestart" -Wait
          Remove-Item $installer -Force

      # ─────────────────────────────────────────────
      # 11. CONECTAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Connect Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
            Start-Sleep -Seconds 4
            $tsIP = & $ts ip -4 2>$null
            $retries++
          }

          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 12. VERIFICAR RDP
      # ─────────────────────────────────────────────
      - name: Verify RDP
        run: |
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP port 3389 not reachable"; exit 1
          }
          Write-Host "RDP reachable on port 3389 ✓" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 13. VERIFICAR APLICACIONES INSTALADAS
      # ─────────────────────────────────────────────
      - name: Verify Installed Apps
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║         VERIFICATION REPORT                      ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          
          Write-Host "║  NODE.JS:" -NoNewline
          try { node --version 2>$null; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  NPM:    " -NoNewline
          try { npm --version 2>$null; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  PYTHON:" -NoNewline
          try { 
            $py = Get-Command python -ErrorAction SilentlyContinue
            if ($py) { & $py.Source --version 2>$null; Write-Host " ✓" -ForegroundColor Green }
            else { Write-Host " ✗" -ForegroundColor Red }
          } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  PIP:    " -NoNewline
          try { 
            $pip = Get-Command pip -ErrorAction SilentlyContinue
            if ($pip) { & $pip.Source --version 2>$null; Write-Host " ✓" -ForegroundColor Green }
            else { 
              $py = Get-Command python -ErrorAction SilentlyContinue
              if ($py) { & $py.Source -m pip --version 2>$null; Write-Host " ✓ (via python -m pip)" -ForegroundColor Green }
              else { Write-Host " ✗" -ForegroundColor Red }
            }
          } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  GIT:   " -NoNewline
          try { git --version 2>$null; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  JAVA:  " -NoNewline
          try { java -version 2>&1 | Select-Object -First 1; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  STEAM: " -NoNewline
          $steamExe = "C:\Steam\Steam.exe"
          if (Test-Path $steamExe) { Write-Host " ✓" -ForegroundColor Green } else { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  MESA3D:" -NoNewline
          $mesaOk = Test-Path "C:\mesa3d\bin\opengl32.dll"
          if ($mesaOk) { Write-Host " ✓ (OpenGL 4.6)" -ForegroundColor Green } else { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "╚════════════════
